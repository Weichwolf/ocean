<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCEAN Simulator – Map Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Fira Code', monospace; background: #1a1a2e; color: #e0e0e0; }
#app { display: flex; height: 100vh; }
#map { flex: 1; }
#sidebar { width: 420px; background: #16213e; overflow-y: auto; border-left: 1px solid #333; display: flex; flex-direction: column; }
#sidebar.hidden { display: none; }

.panel { padding: 16px; border-bottom: 1px solid #333; }
.panel h2 { font-size: 14px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.panel h1 { font-size: 22px; margin-bottom: 4px; }

.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; margin-right: 4px; margin-bottom: 4px; }
.tag-faction { background: var(--fc); color: #fff; }
.tag-role { background: #333; color: #ccc; }
.tag-sex { background: #2d3748; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.stat { background: #1a1a2e; padding: 8px; border-radius: 4px; }
.stat-label { font-size: 10px; color: #666; text-transform: uppercase; }
.stat-value { font-size: 18px; font-weight: bold; }

.ocean-bar { display: flex; align-items: center; margin: 3px 0; }
.ocean-label { width: 24px; font-size: 11px; color: #888; }
.ocean-track { flex: 1; height: 8px; background: #1a1a2e; border-radius: 4px; margin: 0 8px; position: relative; }
.ocean-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.ocean-val { width: 36px; font-size: 11px; text-align: right; }

.conn-list { max-height: 300px; overflow-y: auto; }
.conn { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #222; cursor: pointer; }
.conn:hover { background: #1a1a2e; }
.conn-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
.conn-name { flex: 1; font-size: 13px; }
.conn-meta { font-size: 11px; color: #666; }
.conn-bar { width: 60px; height: 4px; background: #1a1a2e; border-radius: 2px; margin-left: 8px; }
.conn-bar-fill { height: 100%; border-radius: 2px; }

.family { margin: 4px 0; cursor: pointer; }
.family:hover { color: #fff; }
.family-icon { margin-right: 4px; }

.building { font-size: 12px; color: #888; margin-top: 4px; }
.building a { color: #5dade2; text-decoration: none; }

#legend { position: absolute; bottom: 20px; left: 20px; z-index: 1000; background: rgba(22,33,62,0.9); padding: 12px; border-radius: 6px; }
#legend .item { display: flex; align-items: center; margin: 3px 0; font-size: 12px; }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

#search { position: absolute; top: 12px; right: 440px; z-index: 1000; }
#search input { background: #16213e; border: 1px solid #333; color: #e0e0e0; padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; width: 220px; }
#search input:focus { outline: none; border-color: #5dade2; }
#search .results { background: #16213e; border: 1px solid #333; border-top: none; border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto; display: none; }
#search .results.show { display: block; }
#search .result { padding: 6px 14px; cursor: pointer; font-size: 12px; }
#search .result:hover { background: #1a1a2e; }

#toolbar { position: absolute; top: 12px; left: 60px; z-index: 1000; display: flex; gap: 6px; }
#toolbar button { background: #16213e; border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
#toolbar button:hover { background: #1a1a2e; border-color: #5dade2; }
#toolbar button.active { background: #2d3748; border-color: #5dade2; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="sidebar" class="hidden">
    <div class="panel" id="npc-header"></div>
    <div class="panel" id="npc-ocean"></div>
    <div class="panel" id="npc-emotions"></div>
    <div class="panel" id="npc-stats"></div>
    <div class="panel" id="npc-family"></div>
    <div class="panel" id="npc-events"></div>
    <div class="panel" id="npc-connections"></div>
  </div>
</div>

<div id="legend"></div>
<div id="search">
  <input type="text" placeholder="NPC suchen..." id="search-input">
  <div class="results" id="search-results"></div>
</div>
<div id="toolbar">
  <button id="btn-connections" title="Verbindungen anzeigen">Links</button>
  <button id="btn-households" title="Haushalte hervorheben">Families</button>
</div>

<script>
let DATA = null;
let map, markers = {}, lines = [], selectedNpc = null;
let nodeIndex = {};
let showConnections = false, showHouseholds = false;

const OCEAN_COLORS = { o: '#f39c12', c: '#2ecc71', e: '#e74c3c', a: '#3498db', n: '#9b59b6' };
const OCEAN_LABELS = { o: 'Openness', c: 'Conscientiousness', e: 'Extraversion', a: 'Agreeableness', n: 'Neuroticism' };

async function init() {
  const resp = await fetch('viewer_data.json');
  DATA = await resp.json();
  DATA.nodes.forEach(n => nodeIndex[n.id] = n);

  map = L.map('map', { zoomControl: true }).setView([52.1, 9.36], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OSM', maxZoom: 19,
  }).addTo(map);

  // Settlement labels
  DATA.settlements.forEach(s => {
    L.marker([s.lat, s.lon], {
      icon: L.divIcon({
        className: '', iconSize: [0, 0], iconAnchor: [0, 0],
        html: `<div style="color:#fff;font-size:11px;font-weight:bold;text-shadow:0 0 4px #000;white-space:nowrap;transform:translate(-50%,-20px)">${s.name} (${s.pop})</div>`
      })
    }).addTo(map);
  });

  // NPC markers
  DATA.nodes.forEach(n => {
    const m = L.circleMarker([n.lat, n.lon], {
      radius: 5, fillColor: n.color, color: '#000', weight: 1,
      fillOpacity: 0.85,
    }).addTo(map);
    m.on('click', () => selectNpc(n.id));
    m.bindTooltip(`${n.name}, ${n.age} (${n.role})`, { direction: 'top', offset: [0, -8] });
    markers[n.id] = m;
  });

  // Legend
  const legend = document.getElementById('legend');
  legend.innerHTML = '<div style="font-size:11px;color:#888;margin-bottom:6px">FACTIONS</div>';
  DATA.factions.forEach(f => {
    const c = DATA.faction_colors[f] || '#999';
    legend.innerHTML += `<div class="item"><div class="dot" style="background:${c}"></div>${f}</div>`;
  });

  // Search
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    if (q.length < 2) { results.classList.remove('show'); return; }
    const matches = DATA.nodes.filter(n =>
      n.name.toLowerCase().includes(q) || n.role.includes(q) || n.faction.includes(q)
    ).slice(0, 10);
    results.innerHTML = matches.map(n =>
      `<div class="result" data-id="${n.id}">${n.name} (${n.age}, ${n.role}) – ${n.poi}</div>`
    ).join('');
    results.classList.add('show');
    results.querySelectorAll('.result').forEach(el => {
      el.addEventListener('click', () => {
        selectNpc(parseInt(el.dataset.id));
        results.classList.remove('show');
        input.value = '';
      });
    });
  });

  // Toolbar
  document.getElementById('btn-connections').addEventListener('click', function() {
    showConnections = !showConnections;
    this.classList.toggle('active');
    if (selectedNpc) selectNpc(selectedNpc);
  });
  document.getElementById('btn-households').addEventListener('click', function() {
    showHouseholds = !showHouseholds;
    this.classList.toggle('active');
    drawHouseholds();
  });
}

function clearLines() {
  lines.forEach(l => map.removeLayer(l));
  lines = [];
}

function selectNpc(id) {
  selectedNpc = id;
  const n = nodeIndex[id];
  if (!n) return;

  // Highlight
  Object.values(markers).forEach(m => { m.setRadius(5); m.setStyle({ weight: 1 }); });
  markers[id].setRadius(10);
  markers[id].setStyle({ weight: 3, color: '#fff' });
  map.panTo([n.lat, n.lon]);

  // Sidebar
  document.getElementById('sidebar').classList.remove('hidden');

  // Header
  const sexIcon = n.sex === 'f' ? '&#9792;' : '&#9794;';
  document.getElementById('npc-header').innerHTML = `
    <h1>${n.name} ${sexIcon}</h1>
    <div>
      <span class="tag tag-faction" style="--fc:${n.color}">${n.faction}</span>
      <span class="tag tag-role">${n.role}</span>
      <span class="tag tag-sex">${n.age} Jahre</span>
    </div>
    ${n.building ? `<div class="building">
      <a href="https://www.openstreetmap.org/way/${n.building.osm_id}" target="_blank">OSM #${n.building.osm_id}</a>
      – ${n.building.type}${n.building.address ? ', ' + n.building.address : ''}
    </div>` : ''}
  `;

  // OCEAN – Strich markiert die Konstitution bei Geburt, Balken den heutigen Wert
  let oceanHtml = '<h2>Personality (OCEAN)</h2>';
  for (const [key, val] of Object.entries(n.ocean)) {
    const pct = Math.round(val * 100);
    const d = (n.drift && n.drift[key]) || 0;
    const birth = Math.round((val - d) * 100);
    const color = OCEAN_COLORS[key] || '#888';
    const label = OCEAN_LABELS[key] || key;
    const dTxt = Math.abs(d) < 0.005 ? '' :
      `<span style="color:${d > 0 ? '#e67e22' : '#3498db'};font-size:10px"> ${d > 0 ? '+' : ''}${d.toFixed(2)}</span>`;
    oceanHtml += `<div class="ocean-bar">
      <span class="ocean-label" title="${label} – Strich = Wert bei Geburt">${key.toUpperCase()}</span>
      <div class="ocean-track">
        <div class="ocean-fill" style="width:${pct}%;background:${color}"></div>
        <div title="bei Geburt" style="position:absolute;left:${birth}%;top:-2px;width:2px;height:12px;background:#fff;opacity:.7"></div>
      </div>
      <span class="ocean-val">${val.toFixed(2)}${dTxt}</span>
    </div>`;
  }
  document.getElementById('npc-ocean').innerHTML = oceanHtml;

  // Emotions (VAD)
  const valSign = n.valence >= 0 ? '+' : '';
  const valColor = n.valence > 0.1 ? '#2ecc71' : n.valence < -0.1 ? '#e74c3c' : '#888';
  const arousalDesc = n.arousal > 0.6 ? 'agitated' : n.arousal > 0.3 ? 'alert' : 'calm';
  const valenceDesc = n.valence > 0.2 ? 'content' : n.valence > -0.1 ? 'neutral' : n.valence > -0.3 ? 'uneasy' : 'distressed';
  // Discrete emotion from VAD
  let emotion = 'neutral';
  if (n.valence < -0.2 && n.arousal > 0.5) emotion = n.dominance > 0.5 ? 'angry' : 'afraid';
  else if (n.valence < -0.2 && n.arousal <= 0.5) emotion = 'sad';
  else if (n.valence > 0.2 && n.arousal > 0.3) emotion = 'happy';
  else if (n.valence > 0.1) emotion = 'content';
  else if (n.arousal > 0.5) emotion = 'tense';

  const emotionColors = { happy: '#2ecc71', content: '#27ae60', neutral: '#888', tense: '#f39c12', sad: '#3498db', afraid: '#9b59b6', angry: '#e74c3c' };
  document.getElementById('npc-emotions').innerHTML = `
    <h2>Emotions</h2>
    <div style="font-size:18px;font-weight:bold;color:${emotionColors[emotion] || '#888'};margin-bottom:8px">${emotion.toUpperCase()}</div>
    <div class="ocean-bar">
      <span class="ocean-label" title="Grundstimmung – verschiebt sich durch Verluste und bleibt Jahre">SET</span>
      <div class="ocean-track" style="background:linear-gradient(to right, #e74c3c, #888 50%, #2ecc71)">
        <div style="position:absolute;left:${((n.valence_base||0)+1)/2*100}%;top:-2px;width:4px;height:12px;background:#fff;border-radius:2px"></div>
      </div>
      <span class="ocean-val">${(n.valence_base||0) >= 0 ? '+' : ''}${(n.valence_base||0).toFixed(2)}</span>
    </div>
    <div class="ocean-bar">
      <span class="ocean-label" title="Allostatische Last">STR</span>
      <div class="ocean-track"><div class="ocean-fill" style="width:${(n.stress||0)*100}%;background:#c0392b"></div></div>
      <span class="ocean-val">${(n.stress||0).toFixed(2)}</span>
    </div>
    <div class="ocean-bar">
      <span class="ocean-label">V</span>
      <div class="ocean-track" style="background:linear-gradient(to right, #e74c3c, #888 50%, #2ecc71)">
        <div style="position:absolute;left:${(n.valence+1)/2*100}%;top:-2px;width:4px;height:12px;background:#fff;border-radius:2px"></div>
      </div>
      <span class="ocean-val" style="color:${valColor}">${valSign}${n.valence.toFixed(2)}</span>
    </div>
    <div class="ocean-bar">
      <span class="ocean-label">A</span>
      <div class="ocean-track"><div class="ocean-fill" style="width:${n.arousal*100}%;background:#e67e22"></div></div>
      <span class="ocean-val">${n.arousal.toFixed(2)}</span>
    </div>
    <div style="font-size:11px;color:#666;margin-top:4px">${valenceDesc}, ${arousalDesc}</div>
  `;

  // Stats
  const hpColor = n.health > 0.7 ? '#2ecc71' : n.health > 0.4 ? '#f39c12' : '#e74c3c';
  document.getElementById('npc-stats').innerHTML = `
    <h2>Status</h2>
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Health</div><div class="stat-value" style="color:${hpColor}">${(n.health * 100).toFixed(0)}%</div></div>
      <div class="stat"><div class="stat-label">Calories</div><div class="stat-value">${n.calories.toFixed(1)}d</div></div>
      <div class="stat"><div class="stat-label">Status</div><div class="stat-value">${n.status.toFixed(2)}</div></div>
    </div>
  `;

  // Family
  let famHtml = '<h2>Family</h2>';
  const household = DATA.households.find(h => h.partners.includes(id) || h.children.includes(id));
  if (household) {
    const partnerId = household.partners.find(p => p !== id);
    if (partnerId !== undefined && nodeIndex[partnerId]) {
      const p = nodeIndex[partnerId];
      famHtml += `<div class="family" onclick="selectNpc(${partnerId})"><span class="family-icon">&#9829;</span> ${p.name} (${p.age}, ${p.role})</div>`;
    }
    household.children.forEach(cid => {
      if (cid !== id && nodeIndex[cid]) {
        const c = nodeIndex[cid];
        famHtml += `<div class="family" onclick="selectNpc(${cid})"><span class="family-icon">&#9679;</span> ${c.name} (${c.age})</div>`;
      }
    });
  }
  if (n.parent_a !== undefined && nodeIndex[n.parent_a]) {
    const pa = nodeIndex[n.parent_a];
    famHtml += `<div class="family" onclick="selectNpc(${n.parent_a})"><span class="family-icon">&#9650;</span> ${pa.name} (${pa.age}, mother)</div>`;
  }
  if (n.parent_b !== undefined && nodeIndex[n.parent_b]) {
    const pb = nodeIndex[n.parent_b];
    famHtml += `<div class="family" onclick="selectNpc(${n.parent_b})"><span class="family-icon">&#9650;</span> ${pb.name} (${pb.age}, father)</div>`;
  }
  document.getElementById('npc-family').innerHTML = famHtml;

  // Events
  const eventIcons = { birth: '&#9733;', death: '&#9760;', illness: '&#9763;', injury: '&#9888;', migration: '&#10132;', pair: '&#9829;', adoption: '&#9826;', climate: '&#9729;', bereavement: '&#10013;' };
  const eventColors = { birth: '#2ecc71', death: '#e74c3c', illness: '#f39c12', injury: '#e67e22', migration: '#3498db', pair: '#e91e63', adoption: '#9b59b6', climate: '#5dade2', bereavement: '#8e44ad' };
  let evtHtml = '';
  if (n.events && n.events.length > 0) {
    evtHtml = `<h2>History (${n.events.length} events)</h2><div class="conn-list">`;
    const year0 = DATA.year - Math.floor(DATA.tick / 52);
    n.events.slice().reverse().forEach(e => {
      const yr = year0 + Math.floor(e.tick / 52);
      const wk = (e.tick % 52) + 1;
      const icon = eventIcons[e.type] || '&#9679;';
      const color = eventColors[e.type] || '#888';
      let detail = '';
      if (e.other !== null && nodeIndex[e.other]) detail = ` – ${nodeIndex[e.other].name}`;
      else if (e.other !== null && e.type === 'birth') detail = ' (born)';
      if (e.type === 'bereavement') detail = detail ? ` um${detail.slice(2)}` : ' (Verlust)';
      if (e.poi !== null && DATA.settlements[e.poi]) {
        const sname = DATA.settlements[e.poi].name;
        if (e.type === 'migration') {
          const from = (e.from !== null && DATA.settlements[e.from]) ? DATA.settlements[e.from].name + ' ' : '';
          detail = ` ${from}→ ${sname}`;
        }
      }
      evtHtml += `<div style="padding:4px 0;border-bottom:1px solid #222;font-size:12px">
        <span style="color:${color}">${icon}</span>
        <span style="color:#666">Y${yr} W${wk}</span>
        <span style="color:${color}">${e.type}</span>${detail}
      </div>`;
    });
    evtHtml += '</div>';
  } else {
    evtHtml = '<h2>History</h2><div style="color:#555;font-size:12px">No recorded events</div>';
  }
  document.getElementById('npc-events').innerHTML = evtHtml;

  // Connections
  const conns = DATA.edges
    .filter(e => e.source === id || e.target === id)
    .map(e => {
      const otherId = e.source === id ? e.target : e.source;
      const other = nodeIndex[otherId];
      if (!other) return null;
      return { ...e, other, otherId };
    })
    .filter(Boolean)
    .sort((a, b) => b.bond - a.bond)
    .slice(0, 20);

  let connHtml = `<h2>Connections (${conns.length})</h2><div class="conn-list">`;
  conns.forEach(c => {
    connHtml += `<div class="conn" onclick="selectNpc(${c.otherId})">
      <div class="conn-dot" style="background:${c.other.color}"></div>
      <div class="conn-name">${c.other.name}<br><span class="conn-meta">${c.other.role}, ${c.other.age}</span></div>
      <div style="text-align:right">
        <div class="conn-meta">bond ${c.bond.toFixed(2)}</div>
        <div class="conn-bar"><div class="conn-bar-fill" style="width:${c.bond*100}%;background:${c.other.color}"></div></div>
      </div>
    </div>`;
  });
  connHtml += '</div>';
  document.getElementById('npc-connections').innerHTML = connHtml;

  // Draw connection lines on map
  clearLines();
  if (showConnections) {
    conns.forEach(c => {
      const line = L.polyline([[n.lat, n.lon], [c.other.lat, c.other.lon]], {
        color: c.other.color, weight: Math.max(1, c.bond * 4), opacity: 0.4,
      }).addTo(map);
      lines.push(line);
      // Highlight connected markers
      markers[c.otherId].setRadius(7);
    });
  }
}

function drawHouseholds() {
  clearLines();
  if (!showHouseholds) return;
  DATA.households.forEach(h => {
    const members = [...h.partners, ...h.children].map(id => nodeIndex[id]).filter(Boolean);
    if (members.length < 2) return;
    const center = members[0];
    members.slice(1).forEach(m => {
      const line = L.polyline([[center.lat, center.lon], [m.lat, m.lon]], {
        color: '#e74c3c', weight: 2, opacity: 0.5, dashArray: '4 4',
      }).addTo(map);
      lines.push(line);
    });
  });
}

init();
</script>
</body>
</html>
